; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ArcTrack Logger — STM32C071K8 (Cortex-M0+, 64k Flash / 24k RAM)
; Custom board definition lives in ./boards/genericSTM32C071K8.json
; (no board JSON ships with the ststm32 platform for the C071 family).

[env:genericSTM32C071K8]
platform      = ststm32
board         = genericSTM32C071K8
framework     = arduino

; The C071K variant folder in this Arduino core version ships without a
; linker script, so provide one at the project level. Memory sizes are still
; taken from the board JSON via the builder's --defsym values.
board_build.ldscript = ldscript.ld

; --- USB (crystal-less USB 2.0 FS device) ---
; ENABLE_CDC expands to -DUSBCON -DUSBD_USE_CDC. With CDC enabled and the
; generic-serial path left in place, the core maps `Serial` to the USB
; virtual COM port (SerialUSB), so USB is the default console.
; The C071 has no external crystal here; the core clocks USB from HSI48
; disciplined by the CRS against USB SOF.
build_flags =
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -D USB_MANUFACTURER="Arcturus Inc."
  -D USB_PRODUCT="\"ArcTrack Logger\""

; --- Libraries ---
; TinyGPS++ parses the NMEA stream from the GPS on USART1 (PB6/PB7).
; The W25Q flash driver is the local lib/LoRaE5_SPIFlash (auto-found by the LDF).
; JSON is hand-rolled in main.cpp (flat commands) to save ~12 KB of flash.
lib_deps =
  mikalhart/TinyGPSPlus@^1.0.3

; --- Source scope ---
; Build the real application: main.cpp + the modules (sys/storage/gnss/console).
; Exclude the bench harness (test.cpp), the isolation sketch (minimal.cpp), and
; the AVR reference (sample.cpp) -- each defines its own setup()/loop() or does
; not compile for STM32.
; Single-file application. To build the bench harness instead, swap to +<test.cpp>.
; (reader.cpp is a flash-reader diagnostic; build it with +<reader.cpp> when needed.)
build_src_filter = +<main-ag.cpp>

; --- Upload / debug ---
; Primary flow: program over USB DFU (the C071 ROM bootloader exposes DFU and
; sets up its own HSI48+CRS clock, so it is rock-solid regardless of app state).
;
; To enter DFU before uploading, do ONE of:
;   * send 'b' on the USB console (software reboot to bootloader), or
;   * fit the BOOT0 jumper (PA14/SWCLK -> 3.3V) and power-cycle, or
;   * (first flash) the chip is blank, so it is already in DFU.
; After a DFU flash, remove the jumper (if used) and power-cycle to run the app.
;
; SWD via CubeProgrammer is kept as a fallback below (commented). OpenOCD's
; flash loader fails on this ST-Link + C0 combo, so stlink upload is avoided.
upload_protocol = custom
upload_command  = "C:/Program Files/STMicroelectronics/STM32Cube/STM32CubeProgrammer/bin/STM32_Programmer_CLI.exe" -c port=USB1 -w "$BUILD_DIR/${PROGNAME}.elf" -v
; SWD fallback (needs BOOT0 jumper OFF; connects to a halted/bootloader core):
; upload_command = "C:/Program Files/STMicroelectronics/STM32Cube/STM32CubeProgrammer/bin/STM32_Programmer_CLI.exe" -c port=SWD freq=200 mode=Normal -w "$BUILD_DIR/${PROGNAME}.elf" -v
debug_tool      = stlink

; USB CDC console; baud is nominal for CDC but kept for tooling.
monitor_speed = 115200
